[package]
name = "git-wallpaper-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true

# Single binary the user runs: default mode is the tray daemon.
[[bin]]
name = "git-wallpaper"
path = "src/main.rs"

[dependencies]
git-wallpaper-core = { path = "../core" }
chrono.workspace = true
tray-icon = "0.24.2"
windows.workspace = true

[build-dependencies]
embed-resource = "3.0.12"

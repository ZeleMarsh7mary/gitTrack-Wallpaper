[workspace]
resolver = "2"
members = ["crates/core", "crates/daemon", "crates/settings-ui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Highest MSRV among the dependency tree (image 0.25 needs 1.88).
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
ab_glyph = "0.2.32"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny-skia = "0.12.0"
toml = "1.0.7"
ureq = { version = "2", features = ["json", "tls"] }
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_LibraryLoader",
    "Win32_Security_Cryptography",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_System_Time",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Dwm",
] }
windows-registry = "0.5.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
